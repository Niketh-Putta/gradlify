    <script>
      (function () {
        var host = window.location.hostname;
        if (host === "home.gradlify.com") {
          window.location.replace(
            "https://gradlify.com" +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
        if (
          host === "proteinlens.vercel.app" ||
          (host.startsWith("proteinlens-") && host.endsWith(".vercel.app"))
        ) {
          var path = window.location.pathname;
          if (path === "/" || path === "") {
            window.location.replace(
              "/protein" + window.location.search + window.location.hash
            );
          }
        }
      })();
    </script>
